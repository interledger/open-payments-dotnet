name: Build and Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'OpenPayments.Sdk/**'
      - 'OpenPayments.Sdk.Tests/**'
      - 'OpenPayments.Sdk.HttpSignatureUtils/**'
      - 'OpenPayments.Sdk.HttpSignatureUtils.Tests/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/build.yaml'
  pull_request:
    paths:
      - 'OpenPayments.Sdk/**'
      - 'OpenPayments.Sdk.Tests/**'
      - 'OpenPayments.Sdk.HttpSignatureUtils/**'
      - 'OpenPayments.Sdk.HttpSignatureUtils.Tests/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/build.yaml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run tests with coverage
        run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage"

      - name: Generate coverage report
        run: reportgenerator -reports:"**/coverage.cobertura.xml" -targetdir:"coverage-report" -reporttypes:"Html;TextSummary" -classfilters:"-Interledger.OpenPayments.Generated.*"

      - name: Enforce per-assembly coverage floors
        run: |
          check_assembly() {
            NAME="$1"; FLOOR="$2"
            COV=$(awk -v name="$NAME" '$1 == name && NF == 2 { sub(/%$/, "", $2); print $2 }' coverage-report/Summary.txt)
            if [ -z "$COV" ]; then
              echo "::error::Could not parse line coverage for ${NAME} from coverage-report/Summary.txt"
              exit 1
            fi
            echo "${NAME} line coverage: ${COV}%"
            if ! awk -v c="$COV" -v f="$FLOOR" 'BEGIN { exit !(c + 0 >= f + 0) }'; then
              echo "::error::${NAME} line coverage ${COV}% is below the ${FLOOR}% floor"
              exit 1
            fi
          }
          check_assembly "Interledger.OpenPayments" 60
          check_assembly "Interledger.OpenPayments.HttpSignatureUtils" 60

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report
