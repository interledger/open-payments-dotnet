name: Build and Test HttpSignatureUtils

on:
  workflow_dispatch:
  push:
    paths:
      - 'OpenPayments.Sdk/**'
      - 'OpenPayments.Sdk.Tests/**'
      - 'OpenPayments.Sdk.HttpSignatureUtils/**'
      - 'OpenPayments.Sdk.HttpSignatureUtils.Tests/**'
      - '.github/workflows/dotnet.yml'
  pull_request:
    paths:
      - 'OpenPayments.Sdk/**'
      - 'OpenPayments.Sdk.Tests/**'
      - 'OpenPayments.Sdk.HttpSignatureUtils/**'
      - 'OpenPayments.Sdk.HttpSignatureUtils.Tests/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check for shared mutable BaseUrl
        run: .github/workflows/scripts/check-shared-baseurl.sh

      - name: Check for bypassed error handling
        run: .github/workflows/scripts/check-bypassed-error-handling.sh

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: |
          dotnet test --collect:"XPlat Code Coverage"

      - name: Generate coverage report
        run: |
          reportgenerator -reports:"**/coverage.cobertura.xml" -targetdir:"coverage-report" -reporttypes:Html -classfilters:"-OpenPayments.Sdk.Generated.*"

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report

  check-generated-drift:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install NSwag CLI (pinned)
        run: dotnet tool install --global NSwag.ConsoleCore --version 14.6.2

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Regenerate models
        run: make models

      - name: Fail on generated-output drift
        run: .github/workflows/scripts/check-generated-drift.sh
