name: Build and Test HttpSignatureUtils

on:
  workflow_dispatch:
  push:
    paths:
      - 'OpenPayments.Sdk/**'
      - 'OpenPayments.Sdk.Tests/**'
      - 'OpenPayments.Sdk.HttpSignatureUtils/**'
      - 'OpenPayments.Sdk.HttpSignatureUtils.Tests/**'
      - '.github/workflows/dotnet.yml'
  pull_request:
    paths:
      - 'OpenPayments.Sdk/**'
      - 'OpenPayments.Sdk.Tests/**'
      - 'OpenPayments.Sdk.HttpSignatureUtils/**'
      - 'OpenPayments.Sdk.HttpSignatureUtils.Tests/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check for shared mutable BaseUrl
        run: |
          set -e
          scanned_count=$(find OpenPayments.Sdk/ -name '*.cs' ! -name '*.g.cs' 2>/dev/null | wc -l)
          if [ "$scanned_count" -eq 0 ]; then
            echo "::error::No non-generated .cs files found under OpenPayments.Sdk/ to scan for BaseUrl writes. Did the directory move or get renamed? Update this guard's path so it can't silently pass."
            exit 1
          fi
          matches=$(grep -rnE "BaseUrl[[:space:]]*=" --include='*.cs' --exclude='*.g.cs' OpenPayments.Sdk/ || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "::error::Writes to BaseUrl outside generated code reintroduce the singleton race from issue #16. Pass the target URL per call instead."
            exit 1
          fi

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install swagger-cli
        run: npm install -g swagger-cli

      - name: Install NSwag CLI
        run: dotnet tool install --global NSwag.ConsoleCore

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Build models
        run: make models

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: |
          dotnet test --collect:"XPlat Code Coverage"

      - name: Generate coverage report
        run: |
          reportgenerator -reports:"**/coverage.cobertura.xml" -targetdir:"coverage-report" -reporttypes:Html -classfilters:"-OpenPayments.Sdk.Generated.*"

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report
